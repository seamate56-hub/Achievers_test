<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Seamate Achievers Batch Test — IMUCET Based</title>
<meta name="description" content="Online mock test platform for IMUCET aspirants"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2545;
  --navy-2:#123a6b;
  --navy-3:#1b4c86;
  --gold:#c98a2c;
  --gold-light:#e3a94a;
  --paper:#f6f7fb;
  --paper-2:#ffffff;
  --ink:#152238;
  --ink-soft:#4b5670;
  --line:#dbe1ec;
  --green:#1f7a4d;
  --green-bg:#e6f4ec;
  --red:#b3311c;
  --red-bg:#fbe9e6;
  --purple:#6a3fa0;
  --purple-bg:#efe6f7;
  --grey-bg:#eef1f6;
  --radius:10px;
  --shadow:0 2px 10px rgba(11,37,69,0.08);
  --shadow-lg:0 8px 30px rgba(11,37,69,0.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.heading-font{font-family:'Fraunces','Georgia',serif;}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
::selection{background:var(--gold-light);color:var(--navy)}

/* ---------- Top brand bar (used on registration/instructions) ---------- */
.brand-bar{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%,var(--navy-3) 100%);
  color:#fff;
  padding:22px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.brand-left{display:flex;align-items:center;gap:16px;min-width:0}
.brand-logo{
  width:56px;height:56px;border-radius:50%;
  background:#fff;
  object-fit:cover;
  flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  border:2px solid rgba(255,255,255,.55);
}
.brand-text .eyebrow{font-size:12px;letter-spacing:.04em;color:var(--gold-light);margin:0 0 2px}
.brand-text h1{font-size:20px;margin:0;line-height:1.2;font-weight:600}
.brand-text .sub{font-size:12.5px;color:#c7d3ea;margin-top:2px}

/* ---------- Shell / page containers ---------- */
.page-wrap{max-width:640px;margin:36px auto;padding:0 18px 60px}
.card{
  background:var(--paper-2);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  border:1px solid var(--line);
  padding:26px 24px;
}
.card + .card{margin-top:16px}

/* ---------- Form elements ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.field input{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:8px;
  font-size:15px;color:var(--ink);background:#fff;
}
.field input:focus{outline:none;border-color:var(--navy-3);box-shadow:0 0 0 3px rgba(27,76,134,.12)}
.field .err{color:var(--red);font-size:12.5px;margin-top:4px;display:none}
.field.invalid input{border-color:var(--red)}
.field.invalid .err{display:block}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:8px;border:none;font-size:15px;font-weight:600;
  transition:transform .06s ease, box-shadow .15s ease;
}
.btn-primary{background:var(--navy-2);color:#fff}
.btn-primary:hover{background:var(--navy);}
.btn-primary:active{transform:translateY(1px)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:var(--gold-light)}
.btn-ghost{background:transparent;color:var(--navy-2);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--navy-3)}
.btn-danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

/* ---------- Instructions page ---------- */
.instr-list{list-style:none;margin:0;padding:0}
.instr-list li{
  display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);
}
.instr-list li:last-child{border-bottom:none}
.instr-num{
  flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--navy-2);color:#fff;
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.instr-body b{color:var(--navy)}
.instr-body .muted{color:var(--ink-soft);font-size:13.5px}
.section-summary{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.section-chip{
  background:var(--grey-bg);border:1px solid var(--line);border-radius:20px;
  padding:6px 14px;font-size:13px;font-weight:600;color:var(--navy-2);
}
.warn-box{
  background:var(--red-bg);border:1px solid #f0c3ba;border-radius:8px;padding:14px 16px;color:#7c2415;font-size:13.5px;margin:14px 0;
}
.wa-box{
  background:var(--green-bg);border:1px solid #b9dfc9;border-radius:8px;padding:14px 16px;font-size:13.5px;margin:14px 0;
}
.agree-row{display:flex;align-items:flex-start;gap:10px;margin:18px 0;font-size:13.5px;color:var(--ink-soft)}
.agree-row input{margin-top:3px}

/* ---------- Exam top bar ---------- */
.exam-shell{min-height:100vh;display:flex;flex-direction:column;background:var(--paper)}
.exam-top{
  background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;
  gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.exam-top .id-block{display:flex;align-items:center;gap:10px;min-width:0}
.exam-top .mini-logo{
  width:36px;height:36px;border-radius:50%;background:#fff;object-fit:cover;flex-shrink:0;
  border:1.5px solid rgba(255,255,255,.55);
}
.exam-top .cand{font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exam-top .cand b{display:block;font-size:14px}
.exam-top .spacer{flex:1}
.timer{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:8px;
  padding:7px 14px;font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;letter-spacing:.02em;
}
.timer.low{background:var(--red);border-color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
.subject-tabs{display:flex;gap:6px;padding:8px 18px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.subject-tab{
  padding:8px 16px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--ink-soft);
  background:var(--grey-bg);white-space:nowrap;border:1px solid transparent;
}
.subject-tab.active{background:var(--navy-2);color:#fff}

.exam-body{flex:1;display:flex;gap:0;max-width:1180px;margin:0 auto;width:100%;padding:18px}
.q-panel{flex:1;min-width:0}
.q-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 26px 20px;box-shadow:var(--shadow);
}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.q-tag{font-size:12.5px;font-weight:700;color:var(--navy-2);background:var(--grey-bg);padding:4px 10px;border-radius:20px}
.q-marks{font-size:12px;color:var(--ink-soft)}
.q-text{font-size:16.5px;line-height:1.65;margin-bottom:20px}
.opt{
  display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:8px;margin-bottom:10px;
}
.opt:hover{border-color:var(--navy-3);background:#f8faff}
.opt.selected{border-color:var(--navy-2);background:#eaf1fb}
.opt input{margin-top:3px;flex-shrink:0}
.opt .label{font-weight:700;color:var(--navy-2);flex-shrink:0}
.opt-text{line-height:1.5}

.nav-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}

.q-grid-panel{
  width:250px;flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-left:16px;align-self:flex-start;max-height:calc(100vh - 130px);overflow-y:auto;
}
.legend{display:flex;flex-direction:column;gap:6px;font-size:11.5px;margin-bottom:14px}
.legend-item{display:flex;align-items:center;gap:7px}
.legend-dot{width:13px;height:13px;border-radius:4px;flex-shrink:0}
.grid-nums{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.gnum{
  aspect-ratio:1;border-radius:6px;border:1px solid var(--line);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;color:var(--ink);background:var(--grey-bg);
}
.gnum.current{outline:2px solid var(--navy);outline-offset:1px}
.gnum.answered{background:var(--green);color:#fff;border-color:var(--green)}
.gnum.marked{background:var(--purple);color:#fff;border-color:var(--purple)}
.gnum.answered-marked{background:linear-gradient(135deg,var(--green) 50%,var(--purple) 50%);color:#fff}
.gnum.visited{background:var(--red-bg);border-color:#f0c3ba;color:var(--red)}
.subject-divider{font-size:11px;font-weight:700;color:var(--ink-soft);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.04em}

/* ---------- Mobile question grid drawer ---------- */
.grid-toggle{display:none}
@media (max-width: 880px){
  .exam-body{flex-direction:column;padding:12px}
  .q-grid-panel{
    width:auto;margin-left:0;margin-top:0;max-height:none;
    position:fixed;right:0;top:0;bottom:0;width:78vw;max-width:320px;z-index:40;
    transform:translateX(100%);transition:transform .2s ease;box-shadow:var(--shadow-lg);
  }
  .q-grid-panel.open{transform:translateX(0)}
  .grid-toggle{
    display:flex;position:fixed;right:14px;bottom:14px;z-index:41;width:52px;height:52px;border-radius:50%;
    background:var(--gold);color:var(--navy);align-items:center;justify-content:center;font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,.25);border:none;font-size:13px;
  }
  .grid-backdrop{display:none;position:fixed;inset:0;background:rgba(11,37,69,.35);z-index:39}
  .grid-backdrop.open{display:block}
}

/* ---------- Warning modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(11,37,69,.55);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.modal{
  background:#fff;border-radius:12px;max-width:420px;width:100%;padding:28px 26px;box-shadow:var(--shadow-lg);
  text-align:center;
}
.modal .icon{font-size:38px;margin-bottom:10px}
.modal h3{margin:0 0 10px;color:var(--red)}
.modal p{color:var(--ink-soft);font-size:14.5px;line-height:1.5;margin-bottom:20px}

/* ---------- Performance / results page ---------- */
.result-header{
  background:linear-gradient(135deg,var(--navy),var(--navy-3));color:#fff;padding:30px 26px;border-radius:var(--radius);
  margin-bottom:18px;
}
.result-header h2{margin:0 0 4px;font-size:24px}
.result-header .sub{color:#c7d3ea;font-size:13.5px}
.status-pill{
  display:inline-block;padding:5px 14px;border-radius:20px;font-size:12.5px;font-weight:700;margin-top:10px;
}
.status-pass{background:var(--green-bg);color:var(--green)}
.status-fail{background:var(--red-bg);color:var(--red)}
.status-flag{background:#fde9c9;color:#8a5a00}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;text-align:center}
.stat-box .num{font-size:22px;font-weight:800;color:var(--navy)}
.stat-box .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:2px}

.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
@media (max-width:700px){.charts-row{grid-template-columns:1fr}}
.chart-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center}
.chart-card h4{margin:0 0 10px;font-size:13.5px;color:var(--navy-2)}

.detail-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
.detail-table th,.detail-table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
.detail-table th{color:var(--ink-soft);font-weight:700;font-size:12px}

.review-item{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px}
.review-item.correct{border-left:4px solid var(--green)}
.review-item.incorrect{border-left:4px solid var(--red)}
.review-item.unattempted{border-left:4px solid #b7bfcf}
.review-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.review-tag.correct{background:var(--green-bg);color:var(--green)}
.review-tag.incorrect{background:var(--red-bg);color:var(--red)}
.review-tag.unattempted{background:var(--grey-bg);color:var(--ink-soft)}

/* ---------- Admin ---------- */
.admin-table{width:100%;border-collapse:collapse;font-size:13px}
.admin-table th,.admin-table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.admin-table th{background:var(--grey-bg);position:sticky;top:0}
.admin-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tiny-link{font-size:12px;color:var(--ink-soft);text-decoration:underline;cursor:pointer}

</style>
</head>

<script>
// QUESTION BANK — 120 questions transcribed from the source documents.
// NOTE: The source material provided only 200-question WORTH of content up to
// Q120 as multiple-choice items; Q121-Q200 were not supplied, so this bank
// stops at 120. Every answer key in the source documents was listed as (A),
// so index 0 is used as the correct option throughout, exactly as given.
const QUESTIONS = [
// ---------------- PHYSICS (Q1-Q4) ----------------
{s:"Physics", q:`A projectile is launched from the ground with an initial velocity \\(\\vec{v} = u_x \\hat{i} + u_y \\hat{j}\\). A constant horizontal wind imparts a retardation \\(a_x = -g\\) to the projectile throughout its motion. If the magnitude of horizontal range equals the maximum vertical height attained, the ratio \\(\\frac{u_x}{u_y}\\) is equal to:`,o:[`1`,`\\(\\frac{1}{2}\\)`,`2`,`\\(\\frac{1}{4}\\)`],a:1},
{s:"Physics", q:`An ideal monoatomic gas undergoes a thermodynamic process where its pressure \\(P\\) varies with volume \\(V\\) according to the relation \\(P = \\alpha V^2\\), where \\(\\alpha\\) is a positive constant. The molar heat capacity of the gas for this process is:`,o:[`\\(\\frac{13}{6} R\\)`,`\\(\\frac{11}{6} R\\)`,`\\(\\frac{7}{2} R\\)`,`\\(2 R\\)`],a:1},
{s:"Physics", q:`Two spherical conductors of radii \\(R_1\\) and \\(R_2\\) (\\(R_1 > R_2\\)) carry charges \\(Q_1\\) and \\(Q_2\\) respectively. They are connected by a thin conducting wire. The direction of charge flow is determined by:`,o:[`Total charge ratio \\(\\frac{Q_1}{Q_2}\\)`,`Charge density ratio \\(\\frac{\\sigma_1}{\\sigma_2}\\)`,`Potential difference \\((V_1 - V_2)\\)`,`Capacitance ratio \\(\\frac{R_1}{R_2}\\) only`],a:2},
{s:"Physics", q:`A block of mass \\(m\\) rests on a rough inclined plane of inclination \\(\\theta\\). The coefficient of static friction is \\(\\mu = \\tan\\theta\\). A force \\(F\\) is applied parallel to the incline upward. The minimum force required to move the block up the incline is:`,o:[`\\(mg \\sin\\theta\\)`,`\\(2 mg \\sin\\theta\\)`,`\\(mg (\\sin\\theta + \\mu \\cos\\theta)\\)`,`Zero`],a:1},
// ---------------- CHEMISTRY (Q5-Q8) ----------------
{s:"Chemistry", q:`Among the species \\(\\text{O}_2^+\\), \\(\\text{O}_2^-\\), \\(\\text{N}_2^+\\), and \\(\\text{N}_2^{2-}\\), which one is paramagnetic and possesses a bond order of 1.5?`,o:[`\\(\\text{O}_2^+\\)`,`\\(\\text{O}_2^-\\)`,`\\(\\text{N}_2^+\\)`,`\\(\\text{N}_2^{2-}\\)`],a:1},
{s:"Chemistry", q:`For the reversible exothermic gas-phase reaction \\(2\\text{NO}_2(g) \\rightleftharpoons \\text{N}_2\\text{O}_4(g)\\), if the temperature of an equilibrium mixture is increased at constant total pressure, which statement is correct?`,o:[`The density of the gas mixture increases.`,`The average molar mass of the mixture decreases.`,`The equilibrium constant \\(K_p\\) increases.`,`The partial pressure of \\(\\text{NO}_2\\) decreases.`],a:1},
{s:"Chemistry", q:`For an electron in a hydrogen-like atom, the orbital radial wave function has 2 radial nodes and belongs to an orbital with azimuthal quantum number \\(l = 1\\). The principal quantum number \\(n\\) and the total number of nodes (radial + angular) are respectively:`,o:[`\\(n = 4\\), Total Nodes = 3`,`\\(n = 3\\), Total Nodes = 2`,`\\(n = 4\\), Total Nodes = 2`,`\\(n = 3\\), Total Nodes = 3`],a:0},
{s:"Chemistry", q:`When 1 mol of \\(\\text{KMnO}_4\\) reacts completely with \\(\\text{FeSO}_4\\) in an acidic medium, the number of moles of \\(\\text{FeSO}_4\\) oxidized is:`,o:[`1`,`3`,`5`,`2.5`],a:2},
// ---------------- MATHEMATICS (Q9-Q12) ----------------
{s:"Mathematics", q:`The absolute minimum value of the expression \\(f(x, \\theta) = 9^x + 9^{1-x} + \\sin^2\\theta\\) for all \\(x, \\theta \\in \\mathbb{R}\\) is:`,o:[`5`,`6`,`7`,`8`],a:1},
{s:"Mathematics", q:`If \\(\\alpha\\) and \\(\\beta\\) are the complex roots of the equation \\(x^2 - 2x + 4 = 0\\), then the value of \\(\\alpha^n + \\beta^n\\) for any positive integer \\(n\\) is:`,o:[`\\(2^{n+1} \\cos\\left(\\frac{n\\pi}{3}\\right)\\)`,`\\(2^{n+1} \\sin\\left(\\frac{n\\pi}{3}\\right)\\)`,`\\(2^n \\cos\\left(\\frac{n\\pi}{6}\\right)\\)`,`\\(2^n \\sin\\left(\\frac{n\\pi}{6}\\right)\\)`],a:0},
{s:"Mathematics", q:`The sum of the series \\(S = \\sum_{k=1}^{\\infty} \\frac{1}{k(k+1)(k+2)}\\) evaluates to:`,o:[`\\(\\frac{1}{2}\\)`,`\\(\\frac{1}{4}\\)`,`\\(\\frac{1}{3}\\)`,`\\(\\frac{1}{6}\\)`],a:1},
{s:"Mathematics", q:`The total number of integer solutions \\((x, y, z)\\) to the equation \\(x + y + z = 15\\) such that \\(x \\ge 1\\), \\(y \\ge 2\\), and \\(z \\ge 0\\) is:`,o:[`91`,`78`,`105`,`66`],a:0},
// ---------------- PHYSICS (Q13-Q22) ----------------
{s:"Physics", q:`A particle moves in the x-y plane with a velocity \\(\\vec{v} = a y \\hat{i} + v_0 \\hat{j}\\), where \\(a\\) and \\(v_0\\) are positive constants. If the particle starts from the origin (0,0) at \\(t=0\\), the equation of its trajectory is:`,o:[`\\(y^2 = \\frac{2 v_0}{a} x\\)`,`\\(y^2 = \\frac{v_0}{a} x\\)`,`\\(y = \\frac{a}{2 v_0} x^2\\)`,`\\(x^2 = \\frac{2 v_0}{a} y\\)`],a:0},
{s:"Physics", q:`A smooth wedge of mass \\(M\\) with an inclined face of angle \\(\\theta\\) rests on a smooth horizontal surface. A small block of mass \\(m\\) is placed on the incline and released. The magnitude of horizontal acceleration of the wedge is:`,o:[`\\(\\frac{m g \\sin\\theta \\cos\\theta}{M + m \\sin^2\\theta}\\)`,`\\(\\frac{m g \\sin\\theta}{M + m}\\)`,`\\(\\frac{(M+m) g \\tan\\theta}{M}\\)`,`\\(\\frac{m g \\cos\\theta}{M + m \\cos^2\\theta}\\)`],a:0},
{s:"Physics", q:`A uniform solid sphere of mass \\(M\\) and radius \\(R\\) rolls down an inclined plane of angle \\(\\theta\\) without slipping. The minimum coefficient of static friction \\(\\mu_s\\) required to prevent slipping is:`,o:[`\\(\\frac{2}{7} \\tan\\theta\\)`,`\\(\\frac{2}{5} \\tan\\theta\\)`,`\\(\\frac{5}{7} \\tan\\theta\\)`,`\\(\\frac{1}{3} \\tan\\theta\\)`],a:0},
{s:"Physics", q:`The gravitational potential \\(V\\) in a region of space varies with distance \\(r\\) as \\(V(r) = -\\frac{K}{\\sqrt{r^2 + a^2}}\\), where \\(K\\) and \\(a\\) are positive constants. The magnitude of the gravitational field strength at \\(r = a\\) is:`,o:[`\\(\\frac{K}{2\\sqrt{2} a^2}\\)`,`\\(\\frac{K}{4 a^2}\\)`,`\\(\\frac{K}{\\sqrt{2} a^2}\\)`,`\\(\\frac{K}{2 a^2}\\)`],a:0},

/* ============================================================
   Seamate Achievers Batch Test — IMUCET Based
   Single-file exam engine. All data persists in this browser's
   localStorage only (see note in chat reply about a real backend).
   ============================================================ */

const TOTAL_Q = QUESTIONS.length;
const DURATION_SEC = 180 * 60; // 180 minutes
const ADMIN_WA_NUMBER = "918116217554"; // country code + number
const ADMIN_USER = "admin";
const ADMIN_PASS = "seamate@2026";

const SUBJECTS = [...new Set(QUESTIONS.map(q => q.s))];
const subjCount = s => QUESTIONS.filter(q => q.s === s).length;

const LS_ATTEMPT = "seamate_current_attempt";
const LS_RECORDS = "seamate_records";
const SS_ADMIN = "seamate_admin_ok";

const root = document.getElementById("app");
let state = { page: "register" };
let timerHandle = null;
let cheatModalQueue = [];

// ---------------- helpers ----------------
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return [h,m,s].map(x=>String(x).padStart(2,"0")).join(":");
}
function typeset(){ if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise(); } }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function saveAttempt(){ if(state.attempt) localStorage.setItem(LS_ATTEMPT, JSON.stringify(state.attempt)); }
function loadAttempt(){ try{ return JSON.parse(localStorage.getItem(LS_ATTEMPT)); }catch(e){ return null; } }
function clearAttempt(){ localStorage.removeItem(LS_ATTEMPT); }
function getRecords(){ try{ return JSON.parse(localStorage.getItem(LS_RECORDS)) || []; }catch(e){ return []; } }
function saveRecord(rec){ const r=getRecords(); r.push(rec); localStorage.setItem(LS_RECORDS, JSON.stringify(r)); }

function render(){
  root.innerHTML = "";
  if(state.page === "register") root.appendChild(renderRegister());
  else if(state.page === "instructions") root.appendChild(renderInstructions());
  else if(state.page === "exam") root.appendChild(renderExam());
  else if(state.page === "result") root.appendChild(renderResult());
  else if(state.page === "adminLogin") root.appendChild(renderAdminLogin());
  else if(state.page === "adminPanel") root.appendChild(renderAdminPanel());
  typeset();
}

function brandBar(subtitle){
  return `
  <div class="brand-bar">
    <div class="brand-left">
      <img class="brand-logo" src="${LOGO_SRC}" alt="Seamate logo"/>
      <div class="brand-text">
        <p class="eyebrow">IMUCET-BASED MOCK TEST</p>
        <h1>Seamate Achievers Batch Test</h1>
        ${subtitle ? `<div class="sub">${subtitle}</div>` : ``}
      </div>
    </div>
  </div>`;
}

// =========================================================
// PAGE: Registration
// =========================================================
function renderRegister(){
  const wrap = el(`<div>${brandBar("Registration")}<div class="page-wrap"></div></div>`);
  const pw = wrap.querySelector(".page-wrap");
  pw.appendChild(el(`
    <div class="card">
      <h2 style="margin-top:0;font-size:19px;">Candidate Registration</h2>
      <p style="color:var(--ink-soft);font-size:13.5px;margin-top:-6px;">
        Enter your details exactly as you'd like them to appear on your result.
      </p>
      <div class="field" id="f-name">
        <label>Full Name</label>
        <input id="in-name" type="text" placeholder="e.g. Sahil Kumar" autocomplete="name"/>
        <div class="err">Please enter your name.</div>
      </div>
      <div class="field" id="f-mobile">
        <label>Mobile Number</label>
        <input id="in-mobile" type="tel" placeholder="10-digit mobile number" autocomplete="tel" maxlength="10"/>
        <div class="err">Enter a valid 10-digit mobile number.</div>
      </div>
      <div class="field" id="f-email">
        <label>Email Address <span style="color:var(--red)">*</span></label>
        <input id="in-email" type="email" placeholder="you@example.com" autocomplete="email"/>
        <div class="err">Email address is mandatory and must be valid.</div>
      </div>
      <button class="btn btn-primary btn-block" id="btn-register">Continue to Instructions</button>
      <div style="text-align:center;margin-top:16px;">
        <span class="tiny-link" id="admin-link">Admin</span>
      </div>
    </div>
  `));

  wrap.querySelector("#btn-register").onclick = () => {
    const name = wrap.querySelector("#in-name").value.trim();
    const mobile = wrap.querySelector("#in-mobile").value.trim();
    const email = wrap.querySelector("#in-email").value.trim();
    let ok = true;
    const setInvalid = (id, bad) => wrap.querySelector(id).classList.toggle("invalid", bad);
    if(!name){ setInvalid("#f-name", true); ok = false; } else setInvalid("#f-name", false);
    if(!/^[0-9]{10}$/.test(mobile)){ setInvalid("#f-mobile", true); ok = false; } else setInvalid("#f-mobile", false);
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ setInvalid("#f-email", true); ok = false; } else setInvalid("#f-email", false);
    if(!ok) return;
    state.student = { name, mobile, email };
    state.page = "instructions";
    render();
  };

  wrap.querySelector("#admin-link").onclick = () => { state.page = "adminLogin"; render(); };
  return wrap;
}

// =========================================================
// PAGE: Instructions
// =========================================================
function renderInstructions(){
  const wrap = el(`<div>${brandBar("Instructions — read carefully before you begin")}<div class="page-wrap"></div></div>`);
  const pw = wrap.querySelector(".page-wrap");

// =========================================================
// EXAM ENGINE
// =========================================================
function beginExam(){
  const now = Date.now();
  state.attempt = {
    student: state.student,
    startedAt: now,
    endsAt: now + DURATION_SEC * 1000,
    current: 0,
    answers: Array(TOTAL_Q).fill(null),   // selected option index or null
    marked: Array(TOTAL_Q).fill(false),
    visited: Array(TOTAL_Q).fill(false),
    cheat: { tabSwitches:0, copyAttempts:0, rightClicks:0, consoleAttempts:0, fullscreenExits:0 },
    warningsShown: 0,
    disqualified: false,
    submitted: false
  };
  saveAttempt();
  attachAntiCheat();
  try{ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
  state.page = "exam";
  render();
  startTimerLoop();
}

function resumeIfPossible(){
  const saved = loadAttempt();
  if(saved && !saved.submitted){
    state.attempt = saved;
    state.student = saved.student;
    if(Date.now() >= saved.endsAt){
      finishExam(false);
    } else {
      attachAntiCheat();
      state.page = "exam";
    }
  }
}

let cheatListenersAttached = false;
function attachAntiCheat(){
  if(cheatListenersAttached) return;
  cheatListenersAttached = true;

  document.addEventListener("visibilitychange", () => {
    if(document.hidden && state.page === "exam" && state.attempt && !state.attempt.submitted){
      registerTabSwitch();
    }
  });
  document.addEventListener("copy", () => {
    if(state.page === "exam" && state.attempt) state.attempt.cheat.copyAttempts++;
    saveAttempt();
  });
  document.addEventListener("contextmenu", (e) => {
    if(state.page === "exam" && state.attempt){
      e.preventDefault();
      state.attempt.cheat.rightClicks++;
      saveAttempt();
    }
  });
  document.addEventListener("keydown", (e) => {
    if(state.page !== "exam" || !state.attempt) return;
    const k = e.key;
    const isDevtools = k === "F12" ||
      (e.ctrlKey && e.shiftKey && ["I","J","C","i","j","c"].includes(k)) ||
      (e.ctrlKey && ["u","U"].includes(k));
    if(isDevtools){
      e.preventDefault();
      state.attempt.cheat.consoleAttempts++;
      saveAttempt();
    }
  });
  document.addEventListener("fullscreenchange", () => {
    if(state.page === "exam" && state.attempt && !document.fullscreenElement && !state.attempt.submitted){
      state.attempt.cheat.fullscreenExits++;
      saveAttempt();
    }
  });
}

function registerTabSwitch(){
  const a = state.attempt;
  a.cheat.tabSwitches++;
  saveAttempt();
  if(a.cheat.tabSwitches > 3){
    a.disqualified = true;
    finishExam(true);
  } else {
    showCheatWarning(a.cheat.tabSwitches);
  }
}

function showCheatWarning(count){
  const backdrop = el(`
    <div class="modal-backdrop">
      <div class="modal">
        <div class="icon">⚠️</div>
        <h3>Warning ${count} of 3</h3>
        <p>You switched away from the test tab. Doing this more than 3 times in total will automatically <b>disqualify</b> you and submit your test.</p>
        <button class="btn btn-primary btn-block" id="ack-warn">I understand, continue test</button>
      </div>
    </div>`);
  document.body.appendChild(backdrop);
  backdrop.querySelector("#ack-warn").onclick = () => backdrop.remove();
}

function startTimerLoop(){
  if(timerHandle) clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    if(!state.attempt || state.attempt.submitted){ clearInterval(timerHandle); return; }
    const remaining = (state.attempt.endsAt - Date.now())/1000;
    const timerEl = document.getElementById("exam-timer");
    if(timerEl){
      timerEl.textContent = fmtTime(remaining);
      timerEl.classList.toggle("low", remaining <= 300);
    }
    if(remaining <= 0){
      clearInterval(timerHandle);
      finishExam(false);
    }
  }, 1000);
}

function renderExam(){
  const a = state.attempt;
  a.visited[a.current] = true;
  const q = QUESTIONS[a.current];
  const remaining = (a.endsAt - Date.now())/1000;

  const wrap = el(`
    <div class="exam-shell">
      <div class="exam-top">
        <div class="id-block">
          <img class="mini-logo" src="${LOGO_SRC}" alt="Seamate logo"/>
          <div class="cand"><b>${escapeHtml(a.student.name)}</b>Seamate Achievers Batch Test</div>
        </div>
        <div class="spacer"></div>
        <div class="timer ${remaining<=300?'low':''}" id="exam-timer">${fmtTime(remaining)}</div>
      </div>
      <div class="subject-tabs" id="subject-tabs"></div>
      <div class="grid-backdrop" id="grid-backdrop"></div>
      <div class="exam-body">
        <div class="q-panel">
          <div class="q-card" id="q-card"></div>
        </div>
        <div class="q-grid-panel" id="grid-panel"></div>
      </div>
      <button class="grid-toggle" id="grid-toggle">Q's</button>
    </div>
  `);

  // subject tabs
  const tabsEl = wrap.querySelector("#subject-tabs");
  SUBJECTS.forEach(s => {
    const firstIdx = QUESTIONS.findIndex(x => x.s === s);
    const btn = el(`<button class="subject-tab ${q.s===s?'active':''}">${s} (${subjCount(s)})</button>`);
    btn.onclick = () => { a.current = firstIdx; saveAttempt(); render(); };
    tabsEl.appendChild(btn);
  });

  // question card
  const qcard = wrap.querySelector("#q-card");
  qcard.innerHTML = `
    <div class="q-head">
      <div class="q-tag">Question ${a.current+1} of ${TOTAL_Q} — ${q.s}</div>
      <div class="q-marks">+1 correct &nbsp;•&nbsp; −0.25 incorrect &nbsp;•&nbsp; 0 unattempted</div>
    </div>
    <div class="q-text">${q.q}</div>
    <div class="opts"></div>
    <div class="nav-buttons">
      <button class="btn btn-ghost" id="btn-prev" ${a.current===0?'disabled':''}>← Previous</button>
      <button class="btn btn-ghost" id="btn-clear">Clear Response</button>
      <button class="btn btn-gold" id="btn-mark">${a.marked[a.current] ? 'Unmark Review' : 'Mark for Review'}</button>
      <div style="flex:1"></div>
      <button class="btn btn-primary" id="btn-next" ${a.current===TOTAL_Q-1?'disabled':''}>Next →</button>
      <button class="btn btn-danger" id="btn-submit">Submit Test</button>
    </div>
  `;

  const optsEl = qcard.querySelector(".opts");
  const letters = ["A","B","C","D"];
  q.o.forEach((optText, idx) => {
    const chosen = a.answers[a.current] === idx;
    const opt = el(`
      <label class="opt ${chosen?'selected':''}">
        <input type="radio" name="opt" ${chosen?'checked':''}/>
        <span class="label">${letters[idx]}.</span>
        <span class="opt-text">${optText}</span>
      </label>`);
    opt.onclick = (e) => {
      e.preventDefault();
      a.answers[a.current] = idx;
      saveAttempt();
      render();
    };
    optsEl.appendChild(opt);
  });

  qcard.querySelector("#btn-prev").onclick = () => { if(a.current>0){ a.current--; saveAttempt(); render(); } };
  qcard.querySelector("#btn-next").onclick = () => { if(a.current<TOTAL_Q-1){ a.current++; saveAttempt(); render(); } };
  qcard.querySelector("#btn-clear").onclick = () => { a.answers[a.current] = null; saveAttempt(); render(); };
  qcard.querySelector("#btn-mark").onclick = () => { a.marked[a.current] = !a.marked[a.current]; saveAttempt(); render(); };
  qcard.querySelector("#btn-submit").onclick = () => confirmSubmit();

  // grid panel
  const gridPanel = wrap.querySelector("#grid-panel");
  gridPanel.appendChild(buildGridPanel(a));

  // mobile toggle
  const toggle = wrap.querySelector("#grid-toggle");
  const backdrop = wrap.querySelector("#grid-backdrop");
  toggle.onclick = () => { gridPanel.classList.toggle("open"); backdrop.classList.toggle("open"); };
  backdrop.onclick = () => { gridPanel.classList.remove("open"); backdrop.classList.remove("open"); };

  return wrap;
}

function buildGridPanel(a){
  const panel = el(`<div></div>`);
  panel.appendChild(el(`
    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span>Answered</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--red-bg);border:1px solid #f0c3ba"></span>Visited, not answered</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--purple)"></span>Marked for review</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--grey-bg);border:1px solid var(--line)"></span>Not visited</div>
    </div>
  `));
  SUBJECTS.forEach(s => {
    panel.appendChild(el(`<div class="subject-divider">${s}</div>`));
    const grid = el(`<div class="grid-nums"></div>`);
    QUESTIONS.forEach((q, i) => {
      if(q.s !== s) return;
      let cls = "gnum";
      const answered = a.answers[i] !== null;
      const marked = a.marked[i];
      if(answered && marked) cls += " answered-marked";
      else if(answered) cls += " answered";
      else if(marked) cls += " marked";
      else if(a.visited[i]) cls += " visited";
      if(i === a.current) cls += " current";
      const btn = el(`<div class="${cls}">${i+1}</div>`);
      btn.onclick = () => { a.current = i; saveAttempt(); render(); };
      grid.appendChild(btn);
    });
    panel.appendChild(grid);
  });
  return panel;
}

function confirmSubmit(){
  const a = state.attempt;
  const attempted = a.answers.filter(x => x !== null).length;
  const backdrop = el(`
    <div class="modal-backdrop">
      <div class="modal">
        <div class="icon">📝</div>
        <h3 style="color:var(--navy)">Submit your test?</h3>
        <p>You've attempted <b>${attempted}</b> of <b>${TOTAL_Q}</b> questions. Once submitted, you cannot make further changes.</p>
        <div class="btn-row" style="justify-content:center">
          <button class="btn btn-ghost" id="cancel-sub">Go Back</button>
          <button class="btn btn-danger" id="confirm-sub">Submit Now</button>
        </div>
      </div>
    </div>`);
  document.body.appendChild(backdrop);
  backdrop.querySelector("#cancel-sub").onclick = () => backdrop.remove();
  backdrop.querySelector("#confirm-sub").onclick = () => { backdrop.remove(); finishExam(false); };
}

function finishExam(disqualified){
  const a = state.attempt;
  if(a.submitted) return;
  a.submitted = true;
  a.disqualified = a.disqualified || disqualified;
  a.finishedAt = Date.now();
  clearInterval(timerHandle);
  try{ document.exitFullscreen && document.fullscreenElement && document.exitFullscreen(); }catch(e){}

  // scoring
  let correct=0, incorrect=0, unattempted=0, marks=0;
  const bySubject = {};
  SUBJECTS.forEach(s => bySubject[s] = {correct:0, incorrect:0, unattempted:0, total:subjCount(s)});
  QUESTIONS.forEach((q, i) => {
    const ans = a.answers[i];
    if(ans === null){ unattempted++; bySubject[q.s].unattempted++; }
    else if(ans === q.a){ correct++; marks += 1; bySubject[q.s].correct++; }
    else { incorrect++; marks -= 0.25; bySubject[q.s].incorrect++; }
  });
  const timeTakenSec = Math.round((a.finishedAt - a.startedAt)/1000);
  const percentage = (marks / TOTAL_Q) * 100;

  const record = {
    id: "SA" + a.startedAt,
    name: a.student.name,
    mobile: a.student.mobile,
    email: a.student.email,
    date: new Date(a.finishedAt).toLocaleDateString("en-GB"),
    timeTakenSec,
    totalQuestions: TOTAL_Q,
    attempted: TOTAL_Q - unattempted,
    correct, incorrect, unattempted,
    marks: Math.round(marks*100)/100,
    percentage: Math.round(percentage*100)/100,
    passFail: percentage >= 33 ? "Pass" : "Fail",
    bySubject,
    cheat: a.cheat,
    disqualified: !!a.disqualified,
    answers: a.answers.slice() // for the answer-key review / PDF
  };
  saveRecord(record);
  clearAttempt();
  state.result = record;
  state.page = "result";
  render();
}

function buildReviewHtml(r){
  let html = `<h3 style="margin-top:0;font-size:16px;">Answer Review</h3>`;
  QUESTIONS.forEach((q, i) => {
    const given = r.answers[i];
    const letters = ["A","B","C","D"];
    let cls, tag;
    if(given === null){ cls="unattempted"; tag="Unattempted"; }
    else if(given === q.a){ cls="correct"; tag="Correct"; }
    else { cls="incorrect"; tag="Incorrect"; }
    html += `
      <div class="review-item ${cls}">
        <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;">
          <b style="font-size:13px;">Q${i+1}. ${q.s}</b>
          <span class="review-tag ${cls}">${tag}</span>
        </div>
        <div style="font-size:14px;margin-bottom:6px;">${q.q}</div>
        <div style="font-size:13px;color:var(--ink-soft)">
          Your answer: ${given===null ? "—" : letters[given]+". "+q.o[given]}<br/>
          Correct answer: ${letters[q.a]}. ${q.o[q.a]}
        </div>
      </div>`;
  });
  return html;
}

function drawBarChart(canvas, r){
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  const pad = 34, chartH = h - pad - 20, barGroupW = (w - pad - 10) / SUBJECTS.length;
  const maxV = Math.max(...SUBJECTS.map(s => r.bySubject[s].total), 1);
  ctx.strokeStyle = "#dbe1ec"; ctx.beginPath(); ctx.moveTo(pad,10); ctx.lineTo(pad,h-pad+chartH*0+ (h-pad-chartH)); ctx.stroke();
  ctx.strokeStyle = "#dbe1ec"; ctx.beginPath(); ctx.moveTo(pad, h-pad+ (10)); ctx.lineTo(w-6, h-pad+10); ctx.stroke();
  const baseline = h - pad + 10;
  SUBJECTS.forEach((s, si) => {
    const groupX = pad + si*barGroupW + 10;
    const vals = [r.bySubject[s].correct, r.bySubject[s].incorrect, r.bySubject[s].unattempted];
    const colors = ["#1f7a4d", "#b3311c", "#b7bfcf"];
    const barW = (barGroupW - 24) / 3;
    vals.forEach((v, vi) => {
      const bh = (v / maxV) * chartH;
      ctx.fillStyle = colors[vi];
      ctx.fillRect(groupX + vi*barW, baseline - bh, barW-3, bh);
    });
    ctx.fillStyle = "#4b5670"; ctx.font = "10px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(s.slice(0,4), groupX + barW*1.5 - 2, h-6);
  });
  // legend
  ctx.font = "9px sans-serif"; ctx.textAlign="left";
  const legend=[["Correct","#1f7a4d"],["Incorrect","#b3311c"],["Unattempted","#b7bfcf"]];
  legend.forEach((l,i)=>{ ctx.fillStyle=l[1]; ctx.fillRect(6+i*80,2,8,8); ctx.fillStyle="#4b5670"; ctx.fillText(l[0],17+i*80,10); });
}

function drawRadarChart(canvas, r){
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  const cx = w/2, cy = h/2 + 6, radius = Math.min(w,h)/2 - 34;

  const subjPct = s => r.bySubject[s].total ? (r.bySubject[s].correct / r.bySubject[s].total) * 100 : 0;
  const accuracy = r.attempted ? (r.correct / r.attempted) * 100 : 0;
  const speed = Math.max(0, 100 - (r.timeTakenSec / (180*60)) * 100);

  const axes = [
    {label:"Accuracy", val: accuracy},
    {label:"Speed", val: speed},
    {label: SUBJECTS[0]||"Sub1", val: subjPct(SUBJECTS[0])},
    {label: SUBJECTS[1]||"Sub2", val: subjPct(SUBJECTS[1])},
    {label: SUBJECTS[2]||"Sub3", val: subjPct(SUBJECTS[2])},
  ];
  const n = axes.length;
  const angleFor = i => (Math.PI*2*i/n) - Math.PI/2;

  // grid rings
  ctx.strokeStyle = "#dbe1ec";
  for(let ring=1; ring<=4; ring++){
    ctx.beginPath();
    for(let i=0;i<=n;i++){
      const a = angleFor(i%n), rr = radius*ring/4;
      const x = cx + rr*Math.cos(a), y = cy + rr*Math.sin(a);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  // axes + labels
  ctx.fillStyle = "#4b5670"; ctx.font = "9.5px sans-serif";
  axes.forEach((ax,i)=>{
    const a = angleFor(i);
    const x = cx + radius*Math.cos(a), y = cy + radius*Math.sin(a);
    ctx.strokeStyle="#dbe1ec"; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
    const lx = cx + (radius+16)*Math.cos(a), ly = cy + (radius+16)*Math.sin(a);
    ctx.textAlign = Math.cos(a) > 0.3 ? "left" : (Math.cos(a) < -0.3 ? "right" : "center");
    ctx.fillText(ax.label.slice(0,9), lx, ly);
  });
  // data polygon
  ctx.beginPath();
  axes.forEach((ax,i)=>{
    const a = angleFor(i), rr = radius*(Math.max(0,Math.min(100,ax.val))/100);
    const x = cx+rr*Math.cos(a), y = cy+rr*Math.sin(a);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle = "rgba(27,76,134,0.28)";
  ctx.strokeStyle = "#123a6b";
  ctx.lineWidth = 2;
  ctx.fill(); ctx.stroke();
}

async function downloadResultPDF(r){
  const btn = document.getElementById("btn-download-pdf");
  const orig = btn.textContent;
  btn.textContent = "Preparing PDF...";
  btn.disabled = true;
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:"pt", format:"a4"});
    const pageW = doc.internal.pageSize.getWidth();
    let y = 46;
    try{ doc.addImage(LOGO_SRC, "PNG", 40, 24, 40, 40); }catch(e){}
    doc.setFont("helvetica","bold"); doc.setFontSize(16);
    doc.text("Seamate Achievers Batch Test — Performance Report", 90, y); y+=30;
    doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
    doc.text(`Name: ${r.name}   Phone: ${r.mobile}   Email: ${r.email}`, 40, y); y+=16;
    doc.text(`Date: ${r.date}   Time Taken: ${fmtTime(r.timeTakenSec)}`, 40, y); y+=16;
    doc.text(`Marks: ${r.marks}/${r.totalQuestions}   Percentage: ${r.percentage}%   Result: ${r.passFail}`, 40, y); y+=16;
    doc.text(`Correct: ${r.correct}   Incorrect: ${r.incorrect}   Unattempted: ${r.unattempted}`, 40, y); y+=16;
    doc.text(`Cheating Status: ${r.disqualified ? "Disqualified" : "Clean"}  (Tab switches: ${r.cheat.tabSwitches})`, 40, y); y+=24;

    doc.setFont("helvetica","bold"); doc.setFontSize(12);
    doc.text("Answer Key Review", 40, y); y+=14;
    doc.setFont("helvetica","normal"); doc.setFontSize(9);
    const letters=["A","B","C","D"];
    QUESTIONS.forEach((q,i)=>{
      const given = r.answers[i];
      const status = given===null ? "Unattempted" : (given===q.a ? "Correct" : "Incorrect");
      const line = `Q${i+1} [${q.s}] — Your: ${given===null?"—":letters[given]}  Correct: ${letters[q.a]}  (${status})`;
      const wrapped = doc.splitTextToSize(line, pageW-80);
      wrapped.forEach(wl=>{
        if(y > 780){ doc.addPage(); y = 46; }
        doc.text(wl, 40, y); y+=12;
      });
    });
    doc.save(`Seamate_Result_${r.name.replace(/\s+/g,"_")}.pdf`);
  } catch(e){
    alert("Could not generate PDF: " + e.message);
  } finally {
    btn.textContent = orig;
    btn.disabled = false;
  }
}

function downloadCSV(records){
  const headers = ["Name","Mobile","Email","Date","Marks","Percentage","Result","Correct","Incorrect","Unattempted","TimeTakenSec","TabSwitches","CopyAttempts","RightClicks","ConsoleAttempts","FullscreenExits","Integrity"];
  const rows = records.map(r => [
    r.name, r.mobile, r.email, r.date, r.marks, r.percentage, r.passFail, r.correct, r.incorrect, r.unattempted,
    r.timeTakenSec, r.cheat.tabSwitches, r.cheat.copyAttempts, r.cheat.rightClicks, r.cheat.consoleAttempts, r.cheat.fullscreenExits,
    r.disqualified ? "Disqualified" : "Clean"
  ]);
  const csv = [headers, ...rows].map(row => row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "seamate_exam_records.csv";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
